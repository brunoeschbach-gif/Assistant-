<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SRF Usher Assistant</title>
  <style>
    :root {
      --bg-dark: #0e0f12;
      --card-bg: rgba(24, 26, 32, 0.85);
      --card-border: #2a2d35;
      --accent-red: #e82127;
      --accent-red-hover: #c0191e;
      --text-main: #f0f2f5;
      --text-muted: #8e94a0;
      --input-bg: #14161d;
      --badge-bg: #1e222d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 16px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 20px;
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #ffffff;
    }

    header span {
      font-size: 0.8rem;
      color: var(--accent-red);
      font-weight: 600;
      letter-spacing: 1px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 20px;
      backdrop-filter: blur(10px);
    }

    .card-title {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 12px;
      font-weight: 600;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    @media (max-width: 600px) {
      .grid-2 {
        grid-template-columns: 1fr;
      }
    }

    label {
      font-size: 0.8rem;
      color: var(--text-muted);
      display: block;
      margin-bottom: 6px;
    }

    select, input[type="text"] {
      width: 100%;
      padding: 12px;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    select:focus, input[type="text"]:focus {
      border-color: var(--accent-red);
    }

    .btn {
      background: var(--accent-red);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.2s, transform 0.1s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:hover {
      background: var(--accent-red-hover);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-secondary {
      background: var(--badge-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
    }

    .btn-secondary:hover {
      background: #282c3b;
    }

    .map-container {
      position: relative;
      background: var(--input-bg);
      border-radius: 8px;
      padding: 16px;
      border: 1px solid var(--card-border);
      text-align: center;
    }

    .map-svg {
      width: 100%;
      max-height: 220px;
    }

    .map-node {
      cursor: pointer;
      transition: fill 0.2s;
    }

    .map-node:hover {
      fill: var(--accent-red);
    }

    .search-box {
      display: flex;
      gap: 8px;
    }

    .response-area {
      min-height: 80px;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 16px;
      font-size: 0.95rem;
      line-height: 1.5;
      color: #e1e4ea;
    }

    .audio-controls {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    .pdf-link {
      display: inline-block;
      margin-top: 10px;
      color: var(--accent-red);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.85rem;
    }

    .pdf-link:hover {
      text-decoration: underline;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <h1>SRF Usher Assistant</h1>
      <span>TESLA DARK v1.0</span>
    </header>

    <!-- Context Selector Card -->
    <div class="card">
      <div class="card-title">Context & Filter Controls</div>
      <div class="grid-2">
        <div>
          <label for="locationSelect">Location Context</label>
          <select id="locationSelect" onchange="handleLocationChange()">
            <option value="">Unselected (All Locations)</option>
            <option value="encinitas">Encinitas Temple</option>
            <option value="jstreet">J Street Chapel</option>
          </select>
        </div>
        <div>
          <label for="serviceSelect">Service Session</label>
          <select id="serviceSelect">
            <option value="">All Services</option>
            <option value="1st">1st Service (9:30 AM)</option>
            <option id="service2ndOpt" value="2nd">2nd Service (11:00 AM)</option>
          </select>
        </div>
      </div>
      <div style="margin-top: 12px; text-align: right;">
        <button class="btn btn-secondary" onclick="resetContext()" style="padding: 6px 12px; font-size: 0.8rem;">Clear Context</button>
      </div>
    </div>

    <!-- Interactive Site Plan Card -->
    <div class="card">
      <div class="card-title">Interactive Site Plan & Role Mapping</div>
      <div class="map-container">
        <svg class="map-svg" viewBox="0 0 500 200">
          <rect x="10" y="10" width="480" height="180" rx="10" fill="#181a20" stroke="#2a2d35" stroke-width="2"/>
          <!-- Main Sanctuary -->
          <rect x="140" y="30" width="220" height="100" rx="6" fill="#14161d" stroke="#2a2d35"/>
          <text x="250" y="85" fill="#8e94a0" font-size="14" text-anchor="middle">Main Sanctuary</text>
          
          <!-- Interactive Role Nodes -->
          <g class="map-node" onclick="selectRole('Head Usher')">
            <circle cx="250" cy="155" r="14" fill="#e82127"/>
            <text x="250" y="159" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">HU</text>
          </g>
          <g class="map-node" onclick="selectRole('Seating Usher')">
            <circle cx="180" cy="80" r="14" fill="#282c3b" stroke="#e82127"/>
            <text x="180" y="84" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">SU</text>
          </g>
          <g class="map-node" onclick="selectRole('Foyer Usher')">
            <circle cx="320" cy="80" r="14" fill="#282c3b" stroke="#e82127"/>
            <text x="320" y="84" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">FU</text>
          </g>
          <g class="map-node" onclick="selectRole('Patio Usher')">
            <circle cx="60" cy="100" r="14" fill="#282c3b" stroke="#e82127"/>
            <text x="60" y="104" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">PU</text>
          </g>
        </svg>
      </div>
    </div>

    <!-- Search & Guidance Card -->
    <div class="card">
      <div class="card-title">Procedure Assistant & Direct Search</div>
      <div class="search-box">
        <input type="text" id="queryInput" placeholder="Ask a procedure question or search..." onkeypress="handleKeyPress(event)">
        <button class="btn" onclick="executeQuery()">Ask</button>
      </div>

      <div style="margin-top: 16px;">
        <div id="responseBox" class="response-area">Select a location, click a role on the map, or enter a question to view operational procedures.</div>
        <div id="pdfLinkContainer" class="hidden">
          <a id="pdfLink" href="#" target="_blank" class="pdf-link">📄 View Approved Procedure PDF (Rev 1.0)</a>
        </div>
      </div>

      <div class="audio-controls">
        <button id="voiceBtn" class="btn btn-secondary" onclick="toggleVoiceInput()">🎤 Speak</button>
        <button id="stopAudioBtn" class="btn btn-secondary hidden" onclick="stopSpeech()">⏹ Stop Speaking</button>
      </div>
    </div>
  </div>

  <script>
    let synth = window.speechSynthesis;

    function handleLocationChange() {
      const loc = document.getElementById('locationSelect').value;
      const opt2nd = document.getElementById('service2ndOpt');
      const serviceSel = document.getElementById('serviceSelect');
      
      if (loc === 'jstreet') {
        opt2nd.classList.add('hidden');
        if (serviceSel.value === '2nd') {
          serviceSel.value = '';
        }
      } else {
        opt2nd.classList.remove('hidden');
      }
    }

    function resetContext() {
      document.getElementById('locationSelect').value = '';
      document.getElementById('serviceSelect').value = '';
      document.getElementById('service2ndOpt').classList.remove('hidden');
      document.getElementById('responseBox').innerText = 'Context reset to default (All Locations).';
      document.getElementById('pdfLinkContainer').classList.add('hidden');
    }

    function selectRole(roleName) {
      document.getElementById('queryInput').value = roleName + ' standard operating procedure';
      executeQuery();
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') {
        executeQuery();
      }
    }

    function executeQuery() {
      const query = document.getElementById('queryInput').value.trim();
      const responseBox = document.getElementById('responseBox');
      const pdfContainer = document.getElementById('pdfLinkContainer');

      if (!query) return;

      // Guardrail Check: Intercept Roster Queries
      const rosterTerms = ['roster', 'phone', 'email', 'contact', 'address', 'volunteer list', 'phone number'];
      if (rosterTerms.some(term => query.toLowerCase().includes(term))) {
        responseBox.innerText = "⚠️ Privacy Notice: Volunteer roster and personal contact details are restricted and not available through the public Usher Assistant.";
        pdfContainer.classList.add('hidden');
        speakText("Privacy notice: Volunteer roster details are restricted.");
        return;
      }

      // Simulated Intelligent Response Logic
      const loc = document.getElementById('locationSelect').value || 'general';
      responseBox.innerText = `[${loc.toUpperCase()}] Standard procedure for "${query}": Please ensure seating paths remain clear, assist devotees with minimal distraction, and coordinate directly with the Head Usher during service movement.`;
      pdfContainer.classList.remove('hidden');

      speakText(responseBox.innerText);
    }

    function speakText(text) {
      if (!synth) return;
      synth.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      const stopBtn = document.getElementById('stopAudioBtn');
      
      utterance.onstart = () => stopBtn.classList.remove('hidden');
      utterance.onend = () => stopBtn.classList.add('hidden');
      utterance.onerror = () => stopBtn.classList.add('hidden');

      synth.speak(utterance);
    }

    function stopSpeech() {
      if (synth) {
        synth.cancel();
        document.getElementById('stopAudioBtn').classList.add('hidden');
      }
    }

    function toggleVoiceInput() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("Speech recognition is not supported in this browser.");
        return;
      }
      const recognition = new SpeechRecognition();
      recognition.onstart = () => {
        document.getElementById('voiceBtn').innerText = "🎙 Listening...";
      };
      recognition.onresult = (e) => {
        document.getElementById('queryInput').value = e.results[0][0].transcript;
        document.getElementById('voiceBtn').innerText = "🎤 Speak";
        executeQuery();
      };
      recognition.onerror = () => {
        document.getElementById('voiceBtn').innerText = "🎤 Speak";
      };
      recognition.start();
    }
  </script>
</body>
</html>
